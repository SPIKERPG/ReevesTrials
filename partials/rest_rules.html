<section class="rule-block">
    <div class="rb-title">REST RULES</div>

    <div class="rb-sub">SHORT REST</div>
    <ul>
        <li>Reduce SPIKE by 1</li>
        <li>Trigger Quick Recovery effects if applicable</li>
    </ul>

    <div class="rb-sub">LONG REST</div>
