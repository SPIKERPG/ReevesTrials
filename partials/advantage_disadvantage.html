<section class="rule-block">

    <div class="rb-title">
        ADVANTAGE / DISADVANTAGE
    </div>

    <div class="rb-sub">
        ADVANTAGE
    </div>

    <p>
        Roll twice using the normal die for that roll.
    </p>

    <p>
        Take the higher result.
    </p>

    <div class="rb-sub">
        DISADVANTAGE
    </div>

    <p>
        Roll twice using the normal die for that roll.
    </p>

    <p>
        Take the lower result.
    </p>

</section>
